# Client filters. Makes and groups are taken literally as the client gave them.

[filters]
year_min = 2015  # no upper bound
makes = [
  "BMW", "MERCEDES-BENZ", "AUDI", "PORSCHE", "LAND ROVER", "TESLA", "LEXUS",
  "VOLVO", "CADILLAC", "INFINITI", "ACURA", "JAGUAR", "TOYOTA", "HONDA",
  "NISSAN", "HYUNDAI", "KIA", "VOLKSWAGEN", "MAZDA", "FORD", "JEEP",
]

# Group = top-level folder in photos/. Values are spelled as Copart writes them.
# A lot whose damage is outside all groups fails the filter; if it comes in
# a task file anyway, it goes to other_group.
[damage_groups]
Front_End = ["FRONT END"]
Rear_End = ["REAR END"]
Side = ["SIDE"]
Flood = ["WATER/FLOOD"]
Rollover = ["ROLLOVER"]
All_Over = ["ALL OVER"]
Undercarriage = ["UNDERCARRIAGE"]

[layout]
other_group = "Other"

[photos]
quality = "full"  # thumbnail | full | high_res
