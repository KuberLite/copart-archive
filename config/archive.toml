# Client filters. Makes and groups are taken literally as the client gave them.

[filters]
year_min = 2015  # no upper bound
# Vehicle Type from the Sales Data file (V is a car, K a van or truck, L a trailer).
# The client takes the file as it is, so nothing is dropped by type; filling the
# list would switch the filter on.
vehicle_types = []
makes = [
  "BMW", "MERCEDES-BENZ", "AUDI", "PORSCHE", "LAND ROVER", "TESLA", "LEXUS",
  "VOLVO", "CADILLAC", "INFINITI", "ACURA", "JAGUAR", "TOYOTA", "HONDA",
  "NISSAN", "HYUNDAI", "KIA", "VOLKSWAGEN", "MAZDA", "FORD", "JEEP",
]
# Damage groups that pass the filter; the rest of the catalog is off.
damage_groups = [
  "Front_End", "Rear_End", "Side", "Flood", "Rollover", "All_Over", "Undercarriage",
]

# Every damage group the archive knows. Group = top-level folder in photos/,
# values are spelled as Copart writes them; together they cover all 25 values
# seen in the Sales Data file. The bot switches groups on and off from here.
# A lot whose damage is in no group goes to other_group if it is taken at all.
[damage_catalog]
Front_End = ["FRONT END"]
Rear_End = ["REAR END"]
Side = ["SIDE"]
Flood = ["WATER/FLOOD"]
Rollover = ["ROLLOVER"]
All_Over = ["ALL OVER"]
Undercarriage = ["UNDERCARRIAGE"]
Hail = ["HAIL"]
Fire = ["BURN", "BURN - ENGINE", "BURN - INTERIOR"]
Top_Roof = ["TOP/ROOF"]
Vandalism = ["VANDALISM"]
Stripped = ["STRIPPED"]
Frame = ["FRAME DAMAGE"]
Mechanical = ["MECHANICAL"]
Minor_Dent = ["MINOR DENT/SCRATCHES"]
Normal_Wear = ["NORMAL WEAR"]
Misc = [
  "DAMAGE HISTORY", "BIOHAZARD/CHEMICAL", "MISSING/ALTERED VIN", "PARTIAL REPAIR",
  "REPLACED VIN", "REJECTED REPAIR", "UNKNOWN",
]

[layout]
other_group = "Other"

[photos]
quality = "full"  # thumbnail | full | high_res
